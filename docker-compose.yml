

services:

  postgres:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations/001_create_enquiries.sql:/docker-entrypoint-initdb.d/001_create_enquiries.sql:ro

    networks:
      - ca-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"] 
      interval: 10s
      timeout: 5s
      retries: 5


  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${BACKEND_IMAGE}:${BACKEND_TAG}


    restart: unless-stopped

    env_file:
      - ./backend/.env.docker

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "5000:5000"

    networks:
      - ca-network


  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: ${FRONTEND_IMAGE}:${FRONTEND_TAG}


    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8080:80"

    networks:
      - ca-network


volumes:

  postgres_data:


networks:

  ca-network:
    driver: bridge